name: Check links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with an error even when the page exists.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --max-retries 3
            --exclude linkedin\.com
            index.html cv/index.html llms.txt README.md
